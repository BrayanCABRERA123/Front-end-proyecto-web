# Cabeceras de seguridad de la web. Se incluye en cada "location" porque nginx no hereda los
# add_header del server cuando la location tiene los suyos (Cache-Control).
# La CSP no limita scripts ni estilos: el index.html de Angular carga los estilos con un onload en
# línea; aquí solo impide que otro sitio meta la web en un iframe, los plugins y cambiar <base>.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
