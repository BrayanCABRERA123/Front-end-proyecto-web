<div class="step-container">

  <div class="step-icon">
    <iconify-icon
      icon="mdi:shield-check-outline"
      style="color: #29AEA0; font-size: 24px;">
    </iconify-icon>
  </div>

  <h2 class="step-title">
    {{ 'FORGOT.VERIFICATION.TITLE' | translate }}
  </h2>

  <p class="step-description">

    {{ 'FORGOT.VERIFICATION.DESCRIPTION' | translate }}

    <span class="email-highlight">
      {{ email }}
    </span>

  </p>

  <div class="code-inputs">
    @for (digit of codeDigits; track $index) {

      <input
        #digitInput
        type="text"
        inputmode="numeric"
        maxlength="1"
        class="digit-input"
        [value]="digit"
        (input)="onDigitInput($index, $event)"
        (keydown)="handleKeyDown($index, $event)"
      />

    }
  </div>

  <a class="resend-link" href="#">
    {{ 'FORGOT.VERIFICATION.RESEND' | translate }}
  </a>

  <button class="btn-primary" (click)="onVerify()">
    {{ 'FORGOT.VERIFICATION.BUTTON' | translate }}
  </button>

  <a class="back-link" href="#">
    ← {{ 'FORGOT.BACK_LOGIN' | translate }}
  </a>

</div>
