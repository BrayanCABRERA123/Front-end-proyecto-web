<div class="step-container">

  <div class="step-icon">
    <iconify-icon
      icon="mdi:email-outline"
      style="color: #29AEA0; font-size: 24px;">
    </iconify-icon>
  </div>

  <h2 class="step-title">
    {{ 'FORGOT.EMAIL.TITLE' | translate }}
  </h2>

  <p class="step-description">
    {{ 'FORGOT.EMAIL.DESCRIPTION' | translate }}
  </p>

  <div class="form-group">

    <label class="form-label">
      {{ 'FORGOT.EMAIL.LABEL' | translate }}
    </label>

    <div class="input-wrapper">

      <iconify-icon
        class="input-icon"
        icon="mdi:email-outline"
        style="color: #67777E; font-size: 18px;">
      </iconify-icon>

      <input
        type="email"
        class="form-input"

        [placeholder]="
          'FORGOT.EMAIL.PLACEHOLDER'
          | translate
        "

        [(ngModel)]="email"
        name="email"
        required
        pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"

        (keypress)="bloquearEspacios($event)"
        (input)="limpiarEspaciosCorreo()"

        [class.input-error]="emailInvalido"
      >

    </div>

    <span class="error-msg" *ngIf="emailInvalido">

      {{ 'FORGOT.EMAIL.INVALID' | translate }}

    </span>

  </div>

  <button
    class="btn-primary"
    (click)="onSubmit()"
    [disabled]="!email || emailInvalido"
  >
    {{ 'FORGOT.EMAIL.BUTTON' | translate }}
  </button>

  <a class="back-link" href="#">
    ← {{ 'FORGOT.BACK_LOGIN' | translate }}
  </a>

</div>
