<div class="forgot-container">

  <div class="auth-shell">

    <app-auth-side-panel></app-auth-side-panel>

    <div class="forgot-form-section">

      <app-auth-card>

        <app-back-button></app-back-button>

        <app-stepper [currentStep]="currentStep"></app-stepper>

        @if (currentStep === 1) {
          <app-email-step
            (emailSent)="onEmailSent($event)">
          </app-email-step>
        }

        @if (currentStep === 2) {
          <app-verification-step
            [email]="userEmail"
            (codeVerified)="onCodeVerified($event)">
          </app-verification-step>
        }

        @if (currentStep === 3) {
          <app-new-password-step
            (passwordUpdated)="onPasswordUpdated($event)">
          </app-new-password-step>
        }

      </app-auth-card>

    </div>

  </div>

</div>
