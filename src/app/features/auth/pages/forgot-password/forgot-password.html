<div class="forgot-container">

  <div class="auth-shell">

    <app-auth-side-panel></app-auth-side-panel>

    <div class="forgot-form-section">

      <app-auth-card>

        <app-back-button></app-back-button>

        <app-stepper [currentStep]="vm.step()"></app-stepper>

        @if (vm.step() === 1) {
          <app-email-step></app-email-step>
        }

        @if (vm.step() === 2) {
          <app-verification-step></app-verification-step>
        }

        @if (vm.step() === 3) {
          <app-new-password-step
            (passwordUpdated)="onPasswordUpdated()">
          </app-new-password-step>
        }

      </app-auth-card>

    </div>

  </div>

</div>
