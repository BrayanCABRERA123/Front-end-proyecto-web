

<div class="profile-container">
    <!-- Sidebar izquierdo del operario -->
    <app-sidebar-operario></app-sidebar-operario>

    <!-- IZQUIERDA -->
    <div class="profile-left">
        <H1>Mi Perfil</H1>

        <div class="card profile-card">
            <div class="avatar">JD</div>

            <h2>Juan Díaz</h2>
            <p class="subtitle">Cliente desde Enero 2026</p>

            <div class="form-group">
                <label>Nombre</label>
                <div class="input-icon">
                    <mat-icon>person</mat-icon>
                    <input type="text" value="Juan Díaz" [readonly]="!editando">
                </div>
            </div>
            
            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-icon">
                    <mat-icon>email</mat-icon>
                    <input type="text" value="juan@email.com" [readonly]="!editando">
                </div>
            </div>
            
            <div class="form-group">
                <label>Teléfono</label>
                <div class="input-icon">
                    <mat-icon>phone</mat-icon>
                    <input type="text" value="+1234 567 890" [readonly]="!editando">
                </div>
            </div>
            
            <div class="form-group">
                <label>Dirección</label>
                <div class="input-icon">
                    <mat-icon>home</mat-icon>
                    <input type="text" value="Calle Principal #123" [readonly]="!editando">
                </div>
            </div>


            <div class="edit-container">
                <button class="btn-edit" (click)="toggleEditar()">
                    <mat-icon>edit</mat-icon>
                    <span>{{ editando ? 'Guardar' : 'Editar Perfil' }}</span>
                </button>
            </div>
        </div>

    </div>

<!-- DERECHA -->
<div class="profile-right">

    <!-- CONTRASEÑA -->
    <div class="card modern-card">
        <div class="card-header">
            <div class="icon-box">
                <mat-icon>password</mat-icon>
            </div>
            <h3>Contraseña</h3>
        </div>

        <div class="divider"></div>

        <div class="card-content">
            <div class="left">
                <div class="mini-icon">
                    <mat-icon>vpn_key</mat-icon>
                </div>
                <div>
                    <p class="title">Cambiar Contraseña</p>
                    <p class="subtitle">Se recomienda una contraseña segura</p>
                </div>
            </div>

            <button class="btn-primary">Cambiar</button>
        </div>
    </div>

    <!-- CUENTA -->
    <div class="card modern-card danger">
        <div class="card-header">
            <div class="icon-box">
                <mat-icon>person</mat-icon>
            </div>
            <h3>Cuenta</h3>
        </div>

        <div class="divider"></div>

        <div class="card-content">
            <div class="left">
                <div class="mini-icon red">
                    <mat-icon>delete</mat-icon>
                </div>
                <div>
                    <p class="title">Eliminar Cuenta</p>
                    <p class="subtitle">
                        Eliminar permanentemente tu cuenta y todos tus datos
                    </p>
                </div>
            </div>

            <button class="btn-danger">Eliminar Cuenta</button>
        </div>
    </div>


</div>
