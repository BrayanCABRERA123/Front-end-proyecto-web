<!-- Tarjeta contenedora del formulario -->
<div class="form-card">

  <!-- Fila: Fecha y Hora -->
  <div class="form-row">

    <div class="form-group">
      <label class="form-label">
        {{ 'RESERVE.DATE' | translate }}
        <mat-icon class="label-icon">calendar_today</mat-icon>
      </label>
      <div class="input-wrapper">
        <mat-icon class="input-icon">calendar_today</mat-icon>
        <input
          type="date"
          class="form-input"
          [(ngModel)]="fecha"
          [min]="minDate"
          [max]="maxDate"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        {{ 'RESERVE.TIME' | translate }}
        <mat-icon class="label-icon">schedule</mat-icon>
      </label>
      <div class="input-wrapper">
        <select class="form-input time-input" [(ngModel)]="hora">
        
          <option value="" disabled selected>
            {{ 'RESERVE.SELECT_TIME' | translate }}
          </option>
        
          <option *ngFor="let h of horasDisponibles" [value]="h">
        
            {{ h }}
        
          </option>
        
        </select>

      </div>
    </div>

  </div>

  <!-- Dirección del Lavado -->
  <div class="form-group">
    <label class="form-label">
      {{ 'RESERVE.ADDRESS' | translate }}
    </label>
    <div class="input-wrapper">
      <mat-icon class="input-icon">location_on</mat-icon>
      <input
        type="text"
        class="form-input"
        [placeholder]="'RESERVE.ADDRESS_PLACEHOLDER' | translate"
        [(ngModel)]="direccion"/>
    </div>
  </div>

  <!-- Fila: Tipo de Vehículo y Tipo de Servicio -->
  <div class="form-row">

    <div class="form-group">
      <label class="form-label">
        {{ 'RESERVE.VEHICLE' | translate }}
        <mat-icon class="label-icon">directions_car</mat-icon>
      </label>
      <div class="select-wrapper">
        <select class="form-select" [(ngModel)]="tipoVehiculo">
          <option value="" disabled>
            {{ 'RESERVE.SELECT' | translate }}
          </option>
          @for (vehiculo of vehiculos; track vehiculo.value) {
            <option [value]="vehiculo.value">
              {{ ('VEHICLE.' + vehiculo.value) | translate }}
            </option>
          }
        </select>
        <mat-icon class="select-icon">expand_more</mat-icon>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        {{ 'RESERVE.SERVICE' | translate }}
        <mat-icon class="label-icon">settings</mat-icon>
      </label>
      <div class="select-wrapper">
        <select class="form-select" [(ngModel)]="tipoServicio" (change)="abrirModalServicio()">
          <option value="" disabled>
            {{ 'RESERVE.SELECT' | translate }}
          </option>
          @for (servicio of servicios; track servicio.value) {
            <option [value]="servicio.value">
              {{ ('SERVICE.' + servicio.value) | translate }}
            </option>
          }
        </select>
        <mat-icon class="select-icon">expand_more</mat-icon>
      </div>
    </div>

  </div>

    <!-- MODAL DE SERVICIO -->
    
    <app-service-modal *ngIf="mostrarModal" [servicio]="tipoServicio" (cerrar)="mostrarModal = false">
    
    </app-service-modal>

  <!-- Botón -->
  <button class="btn-primary" (click)="onSubmit()">
    {{ 'RESERVE.SUBMIT' | translate }}
  </button>

</div>
