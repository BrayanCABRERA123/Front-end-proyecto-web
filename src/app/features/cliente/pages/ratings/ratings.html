<div class="ratings-container">

  <app-sidebar rol="CLIENTE"></app-sidebar>

  <div class="ratings-content">

    <h2>{{ 'RATINGS.TITLE' | translate }}</h2>

    <p class="subtitle">
      {{ 'RATINGS.SUBTITLE' | translate }}
    </p>

    <div class="card ratings-card">

      <p class="question">
        {{ 'RATINGS.QUESTION' | translate }}
      </p>

      <!-- ESTRELLAS -->
      <div class="stars">
        <mat-icon
          *ngFor="let star of [1,2,3,4,5]"
          (click)="calificar(star)"
          [class.active]="star <= rating">
          star
        </mat-icon>
      </div>

      <!-- COMENTARIO -->
      <div class="form-group">
        <label>{{ 'RATINGS.COMMENT' | translate }}</label>
        <textarea
          [placeholder]="'RATINGS.PLACEHOLDER' | translate">
        </textarea>
      </div>

      <!-- BOTÓN -->
      <button class="btn-submit">
        {{ 'RATINGS.SUBMIT' | translate }}
      </button>

    </div>

  </div>

</div>
