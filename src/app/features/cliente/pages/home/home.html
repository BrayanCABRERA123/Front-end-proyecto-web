<div class="home-layout">

  <!-- Sidebar izquierdo -->
  <app-sidebar></app-sidebar>

  <!-- Contenido principal derecho -->
  <main class="home-content">

    <!-- Saludo -->
    <div class="home-header">
      <h1>¡Hola, {{ usuario.nombre }}!</h1>
      <p>Bienvenido de vuelta a Lavado Vehicular</p>
    </div>

    <!-- Tarjetas de resumen -->
    <div class="resumen-grid">
      <div class="resumen-card" *ngFor="let item of resumen">
        <mat-icon class="resumen-icono">{{ item.icono }}</mat-icon>
        <p class="resumen-cantidad">{{ item.cantidad }}</p>
        <p class="resumen-label">{{ item.label }}</p>
      </div>
    </div>

    <!-- Próximas reservas -->
    <div class="reservas-section">

      <div class="reservas-titulo">
        <mat-icon>trending_up</mat-icon>
        <h2>Próximas Reservas</h2>
      </div>

      <div class="reservas-lista">
        <div class="reserva-item" *ngFor="let reserva of proximasReservas">
          <div class="reserva-info">
            <p class="reserva-nombre">{{ reserva.tipo }} — {{ reserva.vehiculo }}</p>
            <p class="reserva-fecha">{{ reserva.fecha }}</p>
          </div>
          <span class="reserva-estado">{{ reserva.estado }}</span>
        </div>
      </div>

    </div>

  </main>

</div>
