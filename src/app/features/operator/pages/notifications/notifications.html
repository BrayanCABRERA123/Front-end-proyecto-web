<div class="notifications-container">

  <app-sidebar rol="OPERARIO"></app-sidebar>

  <div class="content">

    <div class="header">
      <h1>{{ 'NOTIFICATIONS-OPER.OPERATOR.TITLE' | translate }}</h1>
    </div>

    <div class="filters-card">
      <p class="filters-title">{{ 'ASSIGNED_SERVICES.FILTERS.TITLE' | translate }}</p>

      <div class="filters-row">

        <div class="filter-group">
          <label class="filter-label">
            {{ 'ASSIGNED_SERVICES.FILTERS.BY_DATE' | translate }}
          </label>
          <div class="date-input-wrapper">
            <input type="date" class="filter-input" [(ngModel)]="filtroFecha" />
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">
            {{ 'ASSIGNED_SERVICES.FILTERS.BY_SERVICE' | translate }}
          </label>
          <div class="select-wrapper">
            <input
              type="text"
              class="filter-select"
              [placeholder]="'ASSIGNED_SERVICES.FILTERS.SEARCH_PLACEHOLDER' | translate"
              [(ngModel)]="filtroVehiculo" />
            <mat-icon class="select-icon">search</mat-icon>
          </div>
        </div>

        <div class="filter-actions">
          <button class="btn-reset" (click)="resetFiltros()">
            <mat-icon>refresh</mat-icon>
          </button>
          <button class="btn-filter">
            <mat-icon>search</mat-icon>
            {{ 'ASSIGNED_SERVICES.FILTERS.FILTER_BTN' | translate }}
          </button>
        </div>

      </div>
    </div>

    <div class="list">

      <div class="item" *ngFor="let n of notifications">

        <div class="left">
          <mat-icon>{{ n.icon }}</mat-icon>

          <div>
            <p class="title">{{ n.title }}</p>
            <p class="desc">{{ n.desc }}</p>

            <span class="badge" [ngClass]="{ 'read': n.read }">
              {{ n.read
                ? ('NOTIFICATIONS-OPER.OPERATOR.READ' | translate)
                : ('NOTIFICATIONS-OPER.OPERATOR.UNREAD' | translate) }}
            </span>
          </div>
        </div>

        <div class="right">
          <span class="date">{{ n.date }}</span>

          <button class="btn-detail">
            <mat-icon>visibility</mat-icon>
            {{ 'NOTIFICATIONS-OPER.OPERATOR.BTN_DETAIL' | translate }}
          </button>

          <mat-icon class="delete">delete</mat-icon>
        </div>

      </div>

    </div>

  </div>
</div>
