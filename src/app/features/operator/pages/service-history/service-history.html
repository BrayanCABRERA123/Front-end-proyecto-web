<div class="page-container">
  <app-sidebar rol="OPERARIO"></app-sidebar>

  <div class="main-content">

    <div class="page-header">
      <h1 class="page-title">{{ 'SERVICE_HISTORY.TITLE' | translate }}</h1>
      <p class="page-subtitle">
        {{ 'SERVICE_HISTORY.SUBTITLE' | translate }}
      </p>
    </div>

    <app-history-stats
      [serviciosRealizados]="vm.serviciosRealizados()"
      [serviciosCancelados]="vm.serviciosCancelados()">
    </app-history-stats>

    <div class="filters-card">
      <p class="filters-title">{{ 'SERVICE_HISTORY.FILTERS_TITLE' | translate }}</p>

      <div class="filters-row">

        <div class="filter-group">
          <label class="filter-label">{{ 'SERVICE_HISTORY.FILTER_DATE' | translate }}</label>
          <div class="date-input-wrapper">
            <input
              type="date"
              class="filter-input"
              [(ngModel)]="filtroFecha"/>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">{{ 'SERVICE_HISTORY.FILTER_TYPE' | translate }}</label>
          <div class="select-wrapper">
            <select class="filter-select" [(ngModel)]="filtroTipoServicio">
              @for (tipo of tiposServicio; track tipo.value) {
                <option [value]="tipo.value">{{ tipo.label | translate }}</option>
              }
            </select>
            <mat-icon class="select-icon">expand_more</mat-icon>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">&nbsp;</label>
          <div class="select-wrapper">
            <select class="filter-select" [(ngModel)]="filtroEstado">
              @for (estado of estados; track estado.value) {
                <option [value]="estado.value">{{ estado.label | translate }}</option>
              }
            </select>
            <mat-icon class="select-icon">expand_more</mat-icon>
          </div>
        </div>

        <div class="filter-actions">
          <button class="btn-reset">
            <mat-icon>refresh</mat-icon>
          </button>
          <button class="btn-filter">
            <mat-icon>search</mat-icon>
            {{ 'SERVICE_HISTORY.BTN_FILTER' | translate }}
          </button>
        </div>

      </div>
    </div>

    <app-history-table
      [servicios]="serviciosFiltrados">
    </app-history-table>

  </div>
</div>
