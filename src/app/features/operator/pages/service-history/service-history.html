<div class="page-container">
  <app-sidebar rol="OPERATOR"></app-sidebar>

  <div class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">{{ 'SERVICE_HISTORY.TITLE' | translate }}</h1>
        <p class="page-subtitle">{{ 'SERVICE_HISTORY.SUBTITLE' | translate }}</p>
      </div>
    </div>

    <app-history-stats
      [completed]="completed"
      [canceledOrReassigned]="canceledOrReassigned"
      [totalGenerated]="totalGenerated"
      [averageRating]="averageRating">
    </app-history-stats>

    <div class="progress-card">
      <div class="progress-header">
        <span>{{ 'SERVICE_HISTORY.COMPLETION_RATE' | translate }}</span>
        <strong>{{ completionRate }}%</strong>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="animatedPercentage"></div>
      </div>
    </div>

    <div class="filters-card">

      <div class="filters-row">

        <div class="filter-group search-group">
          <div class="search-wrapper">
            <mat-icon>search</mat-icon>
            <input
              type="text"
              class="search-input"
              [(ngModel)]="search"
              [placeholder]="'SERVICE_HISTORY.SEARCH_PLACEHOLDER' | translate" />
          </div>
        </div>

        <div class="filter-group">
          <input type="date" class="filter-input" [(ngModel)]="dateFilter" />
        </div>

        <div class="filter-group">
          <div class="select-wrapper">
            <select class="filter-select" [(ngModel)]="serviceFilter">
              <option value="">{{ 'SERVICE_HISTORY.ALL_SERVICES' | translate }}</option>
              @for (type of serviceTypes; track type) {
                <option [value]="type">{{ ('SERVICE.' + type) | translate }}</option>
              }
            </select>
            <mat-icon class="select-icon">expand_more</mat-icon>
          </div>
        </div>

        <button class="btn-reset" (click)="clearFilters()">
          <mat-icon>refresh</mat-icon>
          {{ 'SERVICE_HISTORY.CLEAR' | translate }}
        </button>

      </div>

      <div class="tabs">
        <button class="tab" [class.active]="activeTab === 'todos'" (click)="changeTab('todos')">
          {{ 'SERVICE_HISTORY.TABS.ALL' | translate }} ({{ countTab('todos') }})
        </button>
        <button class="tab" [class.active]="activeTab === 'finalizado'" (click)="changeTab('finalizado')">
          {{ 'SERVICE_HISTORY.TABS.DONE' | translate }} ({{ countTab('finalizado') }})
        </button>
        <button class="tab" [class.active]="activeTab === 'cancelado'" (click)="changeTab('cancelado')">
          {{ 'SERVICE_HISTORY.TABS.CANCELED' | translate }} ({{ countTab('cancelado') }})
        </button>
        <button class="tab" [class.active]="activeTab === 'reasignado'" (click)="changeTab('reasignado')">
          {{ 'SERVICE_HISTORY.TABS.REASSIGNED' | translate }} ({{ countTab('reasignado') }})
        </button>
      </div>

    </div>

    <app-history-table
      [services]="filteredServices"
      (viewDetail)="viewDetail($event)">
    </app-history-table>

  </div>
</div>
