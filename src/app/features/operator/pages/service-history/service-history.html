<div class="page-container">
  <app-sidebar rol="OPERARIO"></app-sidebar>

  <div class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">{{ 'SERVICE_HISTORY.TITLE' | translate }}</h1>
        <p class="page-subtitle">{{ 'SERVICE_HISTORY.SUBTITLE' | translate }}</p>
      </div>
    </div>

    <app-history-stats
      [finalizados]="finalizados"
      [canceladosReasignados]="canceladosReasignados"
      [totalGenerado]="totalGenerado"
      [calificacionPromedio]="calificacionPromedio">
    </app-history-stats>

    <div class="progress-card">
      <div class="progress-header">
        <span>{{ 'SERVICE_HISTORY.COMPLETION_RATE' | translate }}</span>
        <strong>{{ tasaCompletados }}%</strong>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="porcentajeAnimado"></div>
      </div>
    </div>

    <div class="filters-card">

      <div class="filters-row">

        <div class="filter-group search-group">
          <div class="search-wrapper">
            <mat-icon>search</mat-icon>
            <input
              type="text"
              class="search-input"
              [(ngModel)]="busqueda"
              [placeholder]="'SERVICE_HISTORY.SEARCH_PLACEHOLDER' | translate" />
          </div>
        </div>

        <div class="filter-group">
          <input type="date" class="filter-input" [(ngModel)]="filtroFecha" />
        </div>

        <div class="filter-group">
          <div class="select-wrapper">
            <select class="filter-select" [(ngModel)]="filtroServicio">
              <option value="">{{ 'SERVICE_HISTORY.ALL_SERVICES' | translate }}</option>
              @for (tipo of tiposServicio; track tipo) {
                <option [value]="tipo">{{ ('SERVICE.' + tipo) | translate }}</option>
              }
            </select>
            <mat-icon class="select-icon">expand_more</mat-icon>
          </div>
        </div>

        <button class="btn-reset" (click)="limpiarFiltros()">
          <mat-icon>refresh</mat-icon>
          {{ 'SERVICE_HISTORY.CLEAR' | translate }}
        </button>

      </div>

      <div class="tabs">
        <button class="tab" [class.active]="tabActiva === 'todos'" (click)="cambiarTab('todos')">
          {{ 'SERVICE_HISTORY.TABS.ALL' | translate }} ({{ contarTab('todos') }})
        </button>
        <button class="tab" [class.active]="tabActiva === 'finalizado'" (click)="cambiarTab('finalizado')">
          {{ 'SERVICE_HISTORY.TABS.DONE' | translate }} ({{ contarTab('finalizado') }})
        </button>
        <button class="tab" [class.active]="tabActiva === 'cancelado'" (click)="cambiarTab('cancelado')">
          {{ 'SERVICE_HISTORY.TABS.CANCELED' | translate }} ({{ contarTab('cancelado') }})
        </button>
        <button class="tab" [class.active]="tabActiva === 'reasignado'" (click)="cambiarTab('reasignado')">
          {{ 'SERVICE_HISTORY.TABS.REASSIGNED' | translate }} ({{ contarTab('reasignado') }})
        </button>
      </div>

    </div>

    <app-history-table
      [servicios]="serviciosFiltrados"
      (verDetalle)="verDetalle($event)">
    </app-history-table>

  </div>
</div>
