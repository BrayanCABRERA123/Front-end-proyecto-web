<div class="stats-card">

  <div class="icon-wrapper">
    <div class="stat-icon">
      <mat-icon>{{ stat.icono }}</mat-icon>
    </div>

    @if (stat.notificacion > 0) {
      <span class="notification-badge">{{ stat.notificacion }}</span>
    }
  </div>

  <p class="stat-value">{{ stat.valor }}</p>

  <p class="stat-label">{{ stat.label | translate }}</p>

</div>
