<div class="page-container">

  <app-sidebar rol="OPERARIO"></app-sidebar>

  <div class="main-content">

    <div class="page-header">
      <h1 class="page-title">{{ 'ASSIGNED_SERVICES.TITLE' | translate }}</h1>
      <p class="page-subtitle">{{ 'ASSIGNED_SERVICES.SUBTITLE' | translate }}</p>
    </div>

    <div class="stats-badges">
      @for (stat of stats; track stat.label) {
        <div class="stat-badge" [class]="stat.color">
          <span class="stat-value">{{ stat.valor }}</span>
          <span class="stat-label">{{ stat.label | translate }}</span>
        </div>
      }
    </div>

    <div class="filters-card">
      <p class="filters-title">{{ 'ASSIGNED_SERVICES.FILTERS.TITLE' | translate }}</p>

      <div class="filters-row">

        <div class="filter-group">
          <label class="filter-label">{{ 'ASSIGNED_SERVICES.FILTERS.BY_DATE' | translate }}</label>
          <div class="date-input-wrapper">
            <input type="date" class="filter-input" [(ngModel)]="filtroFecha" />
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">{{ 'ASSIGNED_SERVICES.FILTERS.BY_TYPE' | translate }}</label>
          <div class="select-wrapper">
            <select class="filter-select" [(ngModel)]="filtroTipoServicio">
              @for (tipo of tiposServicio; track tipo.value) {
                <option [value]="tipo.value">{{ tipo.label | translate}}</option>
              }
            </select>
            <mat-icon class="select-icon">expand_more</mat-icon>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">&nbsp;</label>
          <label class="filter-label">{{ 'ASSIGNED_SERVICES.FILTERS.BY_SERVICE' | translate }}</label>
          <div class="select-wrapper">
            <input
              type="text"
              class="filter-select"
              [placeholder]="'ASSIGNED_SERVICES.FILTERS.SEARCH_PLACEHOLDER' | translate"
              [(ngModel)]="filtroVehiculo" />
            <mat-icon class="select-icon">search</mat-icon>
          </div>
        </div>

        <div class="filter-actions">
          <button class="btn-reset">
            <mat-icon>refresh</mat-icon>
          </button>
          <button class="btn-filter">
            <mat-icon>search</mat-icon>
            {{ 'ASSIGNED_SERVICES.FILTERS.FILTER_BTN' | translate }}
          </button>
        </div>

      </div>
    </div>

    <app-service-table
      [servicios]="serviciosFiltrados"
      [servicioSeleccionado]="servicioSeleccionado"
      (serviceSelected)="onServiceSelected($event)">
    </app-service-table>

    @if (servicioSeleccionado) {
      <app-service-detail [servicio]="servicioSeleccionado">
      </app-service-detail>
    }

  </div>

</div>
