<div class="form-dialog">

  <div class="form-dialog__header">
    <div>
      <h2>{{ 'ASSIGN_SHIFT_MODAL.TITLE' | translate }}</h2>
      <p>{{ 'ASSIGN_SHIFT_MODAL.SUBTITLE' | translate }}</p>
    </div>
    <button type="button" class="form-dialog__close" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="form-dialog__body">

    <label class="form-field">
      <span>{{ 'ASSIGN_SHIFT_MODAL.OPERATOR_LABEL' | translate }} *</span>
      <select [(ngModel)]="operatorId">
        @for (o of data.operators; track o.id) {
          <option [ngValue]="o.id">{{ o.name }}</option>
        }
      </select>
    </label>

    <label class="form-field">
      <span>{{ 'ASSIGN_SHIFT_MODAL.STATUS_LABEL' | translate }}</span>
      <select [(ngModel)]="status">
        <option value="available">{{ 'ADMIN_OPERATORS.STATUS.available' | translate }}</option>
        <option value="in_service">{{ 'ADMIN_OPERATORS.STATUS.in_service' | translate }}</option>
        <option value="medical_leave">{{ 'ADMIN_OPERATORS.STATUS.medical_leave' | translate }}</option>
      </select>
    </label>

    <label class="form-field">
      <span>{{ 'ASSIGN_SHIFT_MODAL.BAY_LABEL' | translate }}</span>
      <select [(ngModel)]="bay" [disabled]="bayDisabled">
        <option [ngValue]="null">{{ 'ASSIGN_SHIFT_MODAL.NO_BAY' | translate }}</option>
        @for (b of data.bays; track b.id) {
          <option [ngValue]="b.name">{{ b.name }}</option>
        }
      </select>
      @if (bayDisabled) {
        <span class="form-hint">{{ 'OPERATOR_MODAL.BAY_DISABLED_HINT' | translate }}</span>
      }
    </label>

    <p class="form-hint">
      {{ 'ASSIGN_SHIFT_MODAL.HINT' | translate:{ name: selectedOperator?.name ?? '' } }}
    </p>

  </div>

  <div class="form-dialog__actions">
    <button class="form-dialog__cancel" type="button" (click)="close()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button class="form-dialog__submit" type="button" (click)="assign()">
      <mat-icon>event_available</mat-icon>
      {{ 'ASSIGN_SHIFT_MODAL.ASSIGN' | translate }}
    </button>
  </div>

</div>
