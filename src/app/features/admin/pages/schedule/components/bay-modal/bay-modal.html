<div class="form-dialog">

  <div class="form-dialog__header">
    <div>
      <h2>
        {{ (isEditing ? 'BAY_MODAL.TITLE_EDIT' : 'BAY_MODAL.TITLE_CREATE') | translate }}
      </h2>
      <p>{{ 'BAY_MODAL.SUBTITLE' | translate }}</p>
    </div>
    <button type="button" class="form-dialog__close" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="form-dialog__body">

    <label class="form-field" [class.form-field--invalid]="nameError">
      <span>{{ 'BAY_MODAL.NAME_LABEL' | translate }}</span>
      <input
        type="text"
        [(ngModel)]="name"
        (blur)="nameTouched = true"
        maxlength="40"
        [placeholder]="'BAY_MODAL.NAME_PLACEHOLDER' | translate">
      @if (nameError) {
        <span class="form-field__error">
          <mat-icon>error</mat-icon>
          {{ 'BAY_MODAL.ERROR_NAME' | translate }}
        </span>
      }
    </label>

    <label class="form-field">
      <span>{{ 'BAY_MODAL.STATUS_LABEL' | translate }}</span>
      <select [(ngModel)]="status">
        @for (s of statuses; track s.value) {
          <option [ngValue]="s.value">{{ s.labelKey | translate }}</option>
        }
      </select>
    </label>

    

  </div>

  <div class="form-dialog__actions">
    <button class="form-dialog__cancel" type="button" (click)="close()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button class="form-dialog__submit" type="button" [disabled]="!canSave" (click)="save()">
      {{ (isEditing ? 'COMMON.SAVE' : 'COMMON.CREATE') | translate }}
    </button>
  </div>

</div>
