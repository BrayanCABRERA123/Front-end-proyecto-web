<div class="manual-dialog">

  <div class="manual-dialog__header">
    <div>
      <h2>{{ 'MANUAL_PAYMENT_MODAL.TITLE' | translate }}</h2>
      <p>{{ 'MANUAL_PAYMENT_MODAL.SUBTITLE' | translate }}</p>
    </div>
    <button type="button" class="close-x" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="manual-dialog__body">

    <!-- reserva pendiente de pago: de ahí salen cliente, servicio y monto (los fija el mock) -->
    <label class="field">
      <span>{{ 'MANUAL_PAYMENT_MODAL.BOOKING_LABEL' | translate }}</span>
      <select [(ngModel)]="bookingId">
        <option [ngValue]="null" disabled>{{ 'MANUAL_PAYMENT_MODAL.BOOKING_PLACEHOLDER' | translate }}</option>
        @for (b of bookings; track b.bookingId) {
          <option [ngValue]="b.bookingId">{{ b.code }} · {{ b.client }} · {{ b.service }} · {{ b.date }}</option>
        }
      </select>
      @if (!bookings.length) {
        <small class="muted">{{ 'MANUAL_PAYMENT_MODAL.NO_BOOKINGS' | translate }}</small>
      }
    </label>

    <div class="row-2">
      <label class="field">
        <span>{{ 'MANUAL_PAYMENT_MODAL.AMOUNT_LABEL' | translate }}</span>
        <input type="text" [value]="selectedBooking ? '$' + (selectedBooking.amount | number) : '—'" readonly>
      </label>

      <label class="field">
        <span>{{ 'MANUAL_PAYMENT_MODAL.METHOD_LABEL' | translate }}</span>
        <select [(ngModel)]="paymentAccountId">
          @for (m of methods; track m.paymentAccountId) {
            <option [ngValue]="m.paymentAccountId">{{ m.name }}</option>
          }
        </select>
      </label>
    </div>

    <label class="field">
      <span>{{ 'MANUAL_PAYMENT_MODAL.REFERENCE_LABEL' | translate }}</span>
      <input type="text" [(ngModel)]="reference" [placeholder]="'MANUAL_PAYMENT_MODAL.REFERENCE_PLACEHOLDER' | translate">
    </label>

    @if (errorMessage) {
      <small class="field-error">{{ errorMessage }}</small>
    }

  </div>

  <div class="manual-dialog__actions">
    <button class="btn-cancel" type="button" (click)="close()">
      {{ 'MANUAL_PAYMENT_MODAL.CANCEL' | translate }}
    </button>
    <button class="btn-confirm" type="button" [disabled]="!canRegister" (click)="register()">
      {{ 'MANUAL_PAYMENT_MODAL.REGISTER' | translate }}
    </button>
  </div>

</div>
