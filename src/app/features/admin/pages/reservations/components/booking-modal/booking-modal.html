<div class="form-dialog form-dialog--wide">

  <div class="form-dialog__header">
    <div>
      <h2>{{ (editing ? 'BOOKING_MODAL.TITLE_EDIT' : 'BOOKING_MODAL.TITLE_CREATE') | translate }}</h2>
      <p>{{ 'BOOKING_MODAL.SUBTITLE' | translate }}</p>
    </div>
    <button type="button" class="form-dialog__close" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="form-dialog__body">

    <div class="form-dialog__grid-2">
      <label class="form-field" [class.form-field--invalid]="clientInvalid">
        <span>{{ 'BOOKING_MODAL.CLIENT_LABEL' | translate }} *</span>
        <input type="text" [(ngModel)]="client" maxlength="60" [placeholder]="'BOOKING_MODAL.CLIENT_PLACEHOLDER' | translate">
        @if (clientInvalid) {
          <span class="form-field__error"><mat-icon>error</mat-icon>{{ 'BOOKING_MODAL.ERROR_CLIENT' | translate }}</span>
        }
      </label>

      <label class="form-field" [class.form-field--invalid]="phoneInvalid">
        <span>{{ 'BOOKING_MODAL.PHONE_LABEL' | translate }} *</span>
        <input type="tel" [(ngModel)]="phone" maxlength="20" [placeholder]="'BOOKING_MODAL.PHONE_PLACEHOLDER' | translate">
        @if (phoneInvalid) {
          <span class="form-field__error"><mat-icon>error</mat-icon>{{ 'BOOKING_MODAL.ERROR_PHONE' | translate }}</span>
        }
      </label>

      <label class="form-field">
        <span>{{ 'BOOKING_MODAL.EMAIL_LABEL' | translate }}</span>
        <input type="email" [(ngModel)]="email" maxlength="80" [placeholder]="'BOOKING_MODAL.EMAIL_PLACEHOLDER' | translate">
      </label>

      <div class="form-dialog__grid-2">
        <label class="form-field" [class.form-field--invalid]="vehicleInvalid">
          <span>{{ 'BOOKING_MODAL.VEHICLE_LABEL' | translate }} *</span>
          <input type="text" [(ngModel)]="vehicle" maxlength="40" [placeholder]="'BOOKING_MODAL.VEHICLE_PLACEHOLDER' | translate">
          @if (vehicleInvalid) {
            <span class="form-field__error"><mat-icon>error</mat-icon>{{ 'BOOKING_MODAL.ERROR_VEHICLE' | translate }}</span>
          }
        </label>

        <label class="form-field" [class.form-field--invalid]="plateInvalid">
          <span>{{ 'BOOKING_MODAL.PLATE_LABEL' | translate }} *</span>
          <input
            type="text"
            [(ngModel)]="plate"
            maxlength="10"
            [placeholder]="'BOOKING_MODAL.PLATE_PLACEHOLDER' | translate"
            (input)="plate = plate.toUpperCase()">
          @if (plateInvalid) {
            <span class="form-field__error"><mat-icon>error</mat-icon>{{ 'BOOKING_MODAL.ERROR_PLATE' | translate }}</span>
          }
        </label>
      </div>

      <label class="form-field">
        <span>{{ 'BOOKING_MODAL.SERVICE_LABEL' | translate }} *</span>
        <select [(ngModel)]="service" (ngModelChange)="onServiceChange()">
          @for (s of services; track s.name) {
            <option [ngValue]="s.name">{{ s.name }}</option>
          }
        </select>
      </label>

      <div class="form-dialog__grid-2">
        <label class="form-field">
          <span>{{ 'BOOKING_MODAL.DATE_LABEL' | translate }} *</span>
          <input type="date" [(ngModel)]="date">
        </label>

        <div class="form-dialog__grid-2">
          <label class="form-field">
            <span>{{ 'BOOKING_MODAL.TIME_LABEL' | translate }} *</span>
            <input type="time" [(ngModel)]="time">
          </label>

          <label class="form-field">
            <span>{{ 'BOOKING_MODAL.DURATION_LABEL' | translate }}</span>
            <input type="number" min="15" max="480" step="15" [(ngModel)]="durationMin">
          </label>
        </div>
      </div>

      <label class="form-field">
        <span>{{ 'BOOKING_MODAL.BAY_LABEL' | translate }}</span>
        <select [(ngModel)]="bayId">
          <option [ngValue]="null">{{ 'BOOKING_MODAL.NO_BAY' | translate }}</option>
          @for (b of bays; track b.id) {
            <option [ngValue]="b.id">{{ b.name }}</option>
          }
        </select>
      </label>

      <label class="form-field">
        <span>{{ 'BOOKING_MODAL.OPERATOR_LABEL' | translate }}</span>
        <select [(ngModel)]="operatorId">
          <option [ngValue]="null">{{ 'BOOKING_MODAL.NO_OPERATOR' | translate }}</option>
          @for (o of operators; track o.id) {
            <option [ngValue]="o.id">{{ o.name }}</option>
          }
        </select>
      </label>

      <label class="form-field">
        <span>{{ 'BOOKING_MODAL.STATUS_LABEL' | translate }}</span>
        <select [(ngModel)]="status">
          @for (s of statuses; track s.value) {
            <option [ngValue]="s.value">{{ s.labelKey | translate }}</option>
          }
        </select>
      </label>

      <label class="form-field">
        <span>{{ 'BOOKING_MODAL.NOTES_LABEL' | translate }}</span>
        <textarea rows="2" [(ngModel)]="notes" maxlength="200" [placeholder]="'BOOKING_MODAL.NOTES_PLACEHOLDER' | translate"></textarea>
      </label>
    </div>

  </div>

  <div class="form-dialog__actions">
    <button class="form-dialog__cancel" type="button" (click)="close()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button class="form-dialog__submit" type="button" (click)="save()">
      {{ (editing ? 'COMMON.SAVE' : 'BOOKING_MODAL.CREATE') | translate }}
    </button>
  </div>

</div>
