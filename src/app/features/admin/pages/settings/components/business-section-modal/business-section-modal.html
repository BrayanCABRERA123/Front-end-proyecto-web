<div class="form-dialog">

  <div class="form-dialog__header">
    <div class="section-modal__heading">
      <div class="section-modal__icon"><mat-icon>{{ data.icon }}</mat-icon></div>
      <div>
        <h2>{{ data.titleKey | translate }}</h2>
        <p>{{ data.subtitleKey | translate }}</p>
      </div>
    </div>
    <button type="button" class="form-dialog__close" (click)="close()" [attr.aria-label]="'COMMON.CLOSE' | translate">×</button>
  </div>

  <div class="form-dialog__body">
    @for (field of data.fields; track field.key) {
      <label class="form-field" [class.form-field--invalid]="isInvalid(field)">
        <span>{{ field.labelKey | translate }}{{ field.required ? ' *' : '' }}</span>
        <input
          [type]="field.type ?? 'text'"
          [(ngModel)]="values[field.key]"
          [max]="field.type === 'date' ? today : null"
          [placeholder]="(field.placeholderKey ?? 'BUSINESS_DATA.PENDING') | translate">
        @if (isInvalid(field)) {
          <span class="form-field__error"><mat-icon>error</mat-icon>{{ errorFor(field) | translate }}</span>
        }
      </label>
    }

    <p class="form-hint">{{ 'BUSINESS_DATA.MODAL_HINT' | translate }}</p>
  </div>

  <div class="form-dialog__actions">
    <button class="form-dialog__cancel" type="button" (click)="close()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button class="form-dialog__submit" type="button" (click)="apply()">
      <mat-icon>check</mat-icon>
      {{ 'BUSINESS_DATA.APPLY' | translate }}
    </button>
  </div>

</div>
