<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo" routerLink="/cliente" style="cursor: pointer;">
    <img src="images/logo.png" alt="logo" class="logo-img">
    <span>{{ 'SIDEBAR.TITLE' | translate }}</span>
  </div>

  <!-- Info del usuario -->
  <div class="sidebar-usuario">
    <div class="avatar">{{ usuario.iniciales }}</div>
    <div class="usuario-info">
      <p class="nombre">{{ usuario.nombre }}</p>
      <p class="correo">{{ usuario.correo }}</p>
    </div>
  </div>

  <!-- Menú de navegación -->
  <nav class="sidebar-menu">

    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.ruta"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }"
      class="menu-item"
    >
      <mat-icon class="menu-icono">{{ item.icono }}</mat-icon>
      <span class="menu-label">{{ item.label | translate }}</span>
    </a>

  </nav>

  <!-- Botón cerrar sesión -->
  <div class="sidebar-footer">
    <button class="btn-cerrar" (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'SIDEBAR.LOGOUT' | translate }}</span>
    </button>
  </div>

</aside>
