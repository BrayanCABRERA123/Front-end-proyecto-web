<!-- botón hamburguesa solo visible en mobile -->
<button class="hamburger-btn" (click)="toggleSidebar()">
  <mat-icon>{{ isOpen ? 'close' : 'menu' }}</mat-icon>
</button>

<!-- overlay oscuro detrás del sidebar en mobile -->
@if (isOpen) {
  <div class="sidebar-overlay" (click)="closeSidebar()"></div>
}

<aside class="sidebar" [class.active]="isOpen">

  <!-- Logo -->
  <div class="sidebar-logo">
    <img src="images/logo.png" alt="logo" class="logo-img">
    <span>Lavado Vehicular</span>
  </div>

  <!-- Info del usuario -->
  <div class="sidebar-usuario">
    <div class="avatar">{{ usuario.iniciales }}</div>
    <div class="usuario-info">
      <p class="nombre">{{ usuario.nombre }}</p>
      <p class="correo">{{ usuario.correo }}</p>
    </div>
  </div>

  <!-- Menú de navegación -->
  <nav class="sidebar-menu">
    @for (item of menuItems; track item.ruta) {
      <a [routerLink]="item.ruta"
         routerLinkActive="activo"
         [routerLinkActiveOptions]="{ exact: true }"
         class="menu-item"
         (click)="closeSidebar()">
        <mat-icon class="menu-icono">{{ item.icono }}</mat-icon>
        <span class="menu-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Botón cerrar sesión -->
  <div class="sidebar-footer">
    <button class="btn-cerrar" (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar Sesión</span>
    </button>
  </div>

</aside>
