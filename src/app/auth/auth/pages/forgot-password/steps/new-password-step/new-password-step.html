<div class="step-container">

  <!-- Ícono de llave -->
  <div class="step-icon">
    <iconify-icon
      icon="mdi:key-outline"
      style="color: #29AEA0; font-size: 24px;">
    </iconify-icon>
  </div>

  <h2 class="step-title">Nueva Contraseña</h2>
  <p class="step-description">Crea tu nueva contraseña segura</p>

  <!-- Campo nueva contraseña -->
  <div class="form-group">
    <label class="form-label">Nueva Contraseña</label>
    <div class="input-wrapper">
      <iconify-icon
        class="input-icon"
        icon="mdi:lock-outline"
        style="color: #67777E; font-size: 18px;">
      </iconify-icon>

      <input
        [type]="showNewPassword ? 'text' : 'password'"
        class="form-input"
        placeholder="••••••••"
        [(ngModel)]="newPassword"/>

      <button class="toggle-password" (click)="toggleNewPassword()" type="button">
        <iconify-icon
          [attr.icon]="showNewPassword ? 'mdi:eye-outline' : 'mdi:eye-off-outline'"
          style="color: #67777E; font-size: 18px;">
        </iconify-icon>
      </button>
    </div>

    <!-- Requisitos en tiempo real -->
    <div class="requirements">
      <div class="requirement" [class.met]="hasMinLength">
        <span class="req-dot"></span>
        Mínimo 8 caracteres
      </div>
      <div class="requirement" [class.met]="hasUppercase">
        <span class="req-dot"></span>
        Al menos una mayúscula
      </div>
      <div class="requirement" [class.met]="hasNumber">
        <span class="req-dot"></span>
        Al menos un número
      </div>
      <div class="requirement" [class.met]="hasSpecialChar">
        <span class="req-dot"></span>
        Al menos un carácter especial
      </div>
    </div>
  </div>

  <!-- Campo confirmar contraseña -->
  <div class="form-group">
    <label class="form-label">Confirmar Contraseña</label>
    <div class="input-wrapper">
      <iconify-icon
        class="input-icon"
        icon="mdi:lock-outline"
        style="color: #67777E; font-size: 18px;">
      </iconify-icon>

      <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        class="form-input"
        placeholder="••••••••"
        [(ngModel)]="confirmPassword"/>

      <button class="toggle-password" (click)="toggleConfirmPassword()" type="button">
        <iconify-icon
          [attr.icon]="showConfirmPassword ? 'mdi:eye-outline' : 'mdi:eye-off-outline'"
          style="color: #67777E; font-size: 18px;">
        </iconify-icon>
      </button>
    </div>
  </div>

  <button
    class="btn-primary"
    [class.btn-disabled]="!isPasswordValid || !passwordsMatch"
    [disabled]="!isPasswordValid || !passwordsMatch"
    (click)="onSubmit()">
    Actualizar Contraseña
  </button>

  <a class="back-link" href="#">
    ← Volver a Iniciar Sesión
  </a>

</div>
