<div class="dialog-container">

  <!-- ENCABEZADO -->
  <div class="icon-circle">
    <mat-icon>{{ data.icon }}</mat-icon>
  </div>

  <h2 class="dialog-title">{{ data.title | translate }}</h2>
  <p class="dialog-text">{{ data.message | translate }}</p>

  <form (ngSubmit)="confirm()" novalidate>

    <!-- CONTRASEÑA ACTUAL -->
    <div class="form-group">
      <label>{{ 'PASSWORD_CONFIRM_MODAL.LABEL' | translate }}</label>

      <div class="input-wrapper">
        <mat-icon class="input-icon">lock</mat-icon>

        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          maxlength="72"
          [class.input-error]="passwordMissing">

        <button type="button" class="toggle-btn" (click)="showPassword = !showPassword">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      @if (passwordMissing) {
        <span class="error-msg">{{ 'CHANGE_PASSWORD_MODAL.CURRENT_REQUIRED' | translate }}</span>
      }
    </div>

    <!-- error devuelto por el servidor (contraseña incorrecta, correo ya registrado, sin conexión...) -->
    @if (errorKey()) {
      <span class="error-msg" role="alert">{{ errorKey()! | translate }}</span>
    }

    <!-- ACCIONES -->
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="close()">
        {{ 'COMMON.CANCEL' | translate }}
      </button>

      <button
        type="submit"
        class="btn-confirm"
        [class.btn-danger]="data.danger"
        [disabled]="saving()">
        {{ (saving() ? 'PASSWORD_CONFIRM_MODAL.PROCESSING' : data.confirmText) | translate }}
      </button>
    </div>

  </form>

</div>
