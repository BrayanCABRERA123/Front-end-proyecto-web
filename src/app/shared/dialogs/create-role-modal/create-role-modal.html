<div class="role-dialog">

  <div class="role-dialog__header">
    <div>
      <h2>{{ 'CREATE_ROLE_MODAL.TITLE_EDIT' | translate }}</h2>
      <p>{{ 'CREATE_ROLE_MODAL.SUBTITLE_EDIT' | translate }}</p>
    </div>
    <button type="button" class="close-x" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="role-dialog__body">

    <!-- los 3 roles son fijos (ADR-015): se elige uno, no se escribe un nombre -->
    <label class="field">
      <span>{{ 'CREATE_ROLE_MODAL.ROLE_SELECT_LABEL' | translate }}</span>
      <select [ngModel]="role" (ngModelChange)="onRoleChange($event)">
        @for (opt of roleOptions; track opt) {
          <option [ngValue]="opt">{{ ('PROFILE.ROLE.' + opt) | translate }}</option>
        }
      </select>
    </label>

    <span class="field-label">{{ 'CREATE_ROLE_MODAL.PERMISSIONS_LABEL' | translate }}</span>

    <div class="permissions-grid">
      @for (permission of permissionsCatalog; track permission.id) {
        <label class="checkbox-row">
          <input type="checkbox" [checked]="isChecked(permission.id)" (change)="toggle(permission.id)">
          {{ labelKey(permission.code) | translate }}
        </label>
      } @empty {
        <p class="role-dialog__empty">{{ 'CREATE_ROLE_MODAL.NO_PERMISSIONS' | translate }}</p>
      }
    </div>

  </div>

  <div class="role-dialog__actions">
    <button class="btn-cancel" type="button" (click)="close()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button class="btn-confirm" type="button" (click)="save()">
      {{ 'COMMON.SAVE' | translate }}
    </button>
  </div>

</div>
