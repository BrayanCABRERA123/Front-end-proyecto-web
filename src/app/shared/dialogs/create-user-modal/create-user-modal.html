<div class="role-dialog">

  <div class="role-dialog__header">
    <div>
      <h2>{{ 'CREATE_USER_MODAL.TITLE' | translate }}</h2>
      <p>{{ 'CREATE_USER_MODAL.ACCOUNT_SUBTITLE' | translate }}</p>
    </div>
    <button type="button" class="close-x" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="role-dialog__body">

    <label class="field" [class.field--invalid]="vm.firstNameInvalid()">
      <span>{{ 'OPERATOR_MODAL.FIRST_NAMES_LABEL' | translate }} *</span>
      <input type="text" [(ngModel)]="vm.firstName" maxlength="60">
      @if (vm.firstNameInvalid()) {
        <span class="field__error">{{ 'CREATE_USER_MODAL.ERROR_NAME' | translate }}</span>
      }
    </label>

    <label class="field" [class.field--invalid]="vm.lastNameInvalid()">
      <span>{{ 'OPERATOR_MODAL.LAST_NAMES_LABEL' | translate }} *</span>
      <input type="text" [(ngModel)]="vm.lastName" maxlength="60">
      @if (vm.lastNameInvalid()) {
        <span class="field__error">{{ 'CREATE_USER_MODAL.ERROR_NAME' | translate }}</span>
      }
    </label>

    <label class="field" [class.field--invalid]="vm.documentInvalid()">
      <span>{{ 'OPERATOR_MODAL.DOCUMENT_LABEL' | translate }} *</span>
      <input type="text" inputmode="numeric" [(ngModel)]="vm.documentNumber" (input)="vm.sanitizeDocument()" maxlength="20">
      @if (vm.documentInvalid()) {
        <span class="field__error">{{ 'OPERATOR_MODAL.ERROR_DOCUMENT' | translate }}</span>
      }
    </label>

    <label class="field" [class.field--invalid]="vm.emailInvalid()">
      <span>{{ 'CREATE_USER_MODAL.EMAIL_LABEL' | translate }} *</span>
      <input type="email" [(ngModel)]="vm.email" [placeholder]="'CREATE_USER_MODAL.EMAIL_PLACEHOLDER' | translate" maxlength="60">
      @if (vm.emailInvalid()) {
        <span class="field__error">{{ 'CREATE_USER_MODAL.ERROR_EMAIL' | translate }}</span>
      }
    </label>

    <label class="field">
      <span>{{ 'OPERATOR_MODAL.PHONE_LABEL' | translate }}</span>
      <input type="tel" [(ngModel)]="vm.phone" maxlength="20">
    </label>

    <label class="field">
      <span>{{ 'CREATE_USER_MODAL.ROLE_LABEL' | translate }}</span>
      <select [(ngModel)]="vm.role">
        @for (r of vm.roleOptions; track r.value) {
          <option [ngValue]="r.value">{{ r.labelKey | translate }}</option>
        }
      </select>
    </label>

    <label class="field" [class.field--invalid]="vm.passwordInvalid()">
      <span>{{ 'OPERATOR_MODAL.PASSWORD_LABEL' | translate }} *</span>
      <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="vm.password" maxlength="72" autocomplete="new-password">
      @if (vm.passwordInvalid()) {
        <span class="field__error">{{ 'OPERATOR_MODAL.ERROR_PASSWORD' | translate }}</span>
      }
    </label>

    <label class="checkbox-row">
      <input type="checkbox" [(ngModel)]="showPassword">
      {{ 'CREATE_USER_MODAL.SHOW_PASSWORD' | translate }}
    </label>

    <!-- error devuelto por el servidor (correo o cédula ya registrados, sin conexión...) -->
    @if (vm.errorKey()) {
      <span class="field__error" role="alert">{{ vm.errorKey()! | translate }}</span>
    }

  </div>

  <div class="role-dialog__actions">
    <button class="btn-cancel" type="button" (click)="close()">
      {{ 'CREATE_USER_MODAL.CANCEL' | translate }}
    </button>
    <button class="btn-confirm" type="button" (click)="create()" [disabled]="vm.saving()">
      {{ (vm.saving() ? 'OPERATOR_MODAL.SAVING' : 'CREATE_USER_MODAL.CREATE') | translate }}
    </button>
  </div>

</div>
