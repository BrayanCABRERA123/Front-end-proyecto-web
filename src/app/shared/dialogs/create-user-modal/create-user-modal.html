<div class="role-dialog">

  <div class="role-dialog__header">
    <div>
      <h2>{{ (editing ? 'CREATE_USER_MODAL.TITLE_EDIT' : 'CREATE_USER_MODAL.TITLE') | translate }}</h2>
      <p>{{ (editing ? 'CREATE_USER_MODAL.SUBTITLE_EDIT' : 'CREATE_USER_MODAL.SUBTITLE') | translate }}</p>
    </div>
    <button type="button" class="close-x" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="role-dialog__body">

    <label class="field" [class.field--invalid]="nameInvalid">
      <span>{{ 'CREATE_USER_MODAL.NAME_LABEL' | translate }}</span>
      <input type="text" [(ngModel)]="name" [placeholder]="'CREATE_USER_MODAL.NAME_PLACEHOLDER' | translate" maxlength="60">
      @if (nameInvalid) {
        <span class="field__error">{{ 'CREATE_USER_MODAL.ERROR_NAME' | translate }}</span>
      }
    </label>

    <label class="field" [class.field--invalid]="emailInvalid">
      <span>{{ 'CREATE_USER_MODAL.EMAIL_LABEL' | translate }}</span>
      <input type="email" [(ngModel)]="email" [placeholder]="'CREATE_USER_MODAL.EMAIL_PLACEHOLDER' | translate" maxlength="80">
      @if (emailInvalid) {
        <span class="field__error">{{ 'CREATE_USER_MODAL.ERROR_EMAIL' | translate }}</span>
      }
    </label>

    <label class="field">
      <span>{{ 'CREATE_USER_MODAL.ROLE_LABEL' | translate }}</span>
      <select [(ngModel)]="role">
        @for (r of roleOptions; track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </label>

    <label class="checkbox-row">
      <input type="checkbox" [(ngModel)]="invite">
      {{ 'CREATE_USER_MODAL.INVITE_LABEL' | translate }}
    </label>

  </div>

  <div class="role-dialog__actions">
    <button class="btn-cancel" type="button" (click)="close()">
      {{ 'CREATE_USER_MODAL.CANCEL' | translate }}
    </button>
    <button class="btn-confirm" type="button" (click)="create()">
      {{ (editing ? 'COMMON.SAVE' : 'CREATE_USER_MODAL.CREATE') | translate }}
    </button>
  </div>

</div>
