<div class="method-dialog">

  <div class="method-dialog__header">
    <div>
      <h2>{{ (editing ? 'ADD_PAYMENT_METHOD_MODAL.TITLE_EDIT' : 'ADD_PAYMENT_METHOD_MODAL.TITLE') | translate }}</h2>
      <p>{{ (editing ? 'ADD_PAYMENT_METHOD_MODAL.SUBTITLE_EDIT' : 'ADD_PAYMENT_METHOD_MODAL.SUBTITLE') | translate }}</p>
    </div>
    <button type="button" class="close-x" (click)="close()" aria-label="close">×</button>
  </div>

  <div class="method-dialog__body">

    <label class="field" [class.field--invalid]="nameInvalid">
      <span>{{ 'ADD_PAYMENT_METHOD_MODAL.NAME_LABEL' | translate }}</span>
      <input type="text" [(ngModel)]="name" maxlength="50" [placeholder]="'ADD_PAYMENT_METHOD_MODAL.NAME_PLACEHOLDER' | translate">
      @if (nameInvalid) {
        <span class="field__error">{{ 'ADD_PAYMENT_METHOD_MODAL.ERROR_NAME' | translate }}</span>
      }
    </label>

    <label class="field">
      <span>{{ 'ADD_PAYMENT_METHOD_MODAL.TYPE_LABEL' | translate }}</span>
      <input type="text" [(ngModel)]="type" maxlength="40" [placeholder]="'ADD_PAYMENT_METHOD_MODAL.TYPE_PLACEHOLDER' | translate">
    </label>

    <label class="field">
      <span>{{ 'ADD_PAYMENT_METHOD_MODAL.HOLDER_LABEL' | translate }}</span>
      <input type="text" [(ngModel)]="holder" maxlength="80">
    </label>

    <label class="field" [class.field--invalid]="accountInvalid">
      <span>{{ 'ADD_PAYMENT_METHOD_MODAL.ACCOUNT_LABEL' | translate }}</span>
      <input type="text" [(ngModel)]="accountNumber" maxlength="30">
      @if (accountInvalid) {
        <span class="field__error">{{ 'ADD_PAYMENT_METHOD_MODAL.ERROR_ACCOUNT' | translate }}</span>
      }
    </label>

    <label class="checkbox-row">
      <input type="checkbox" [(ngModel)]="needsQr">
      {{ 'ADD_PAYMENT_METHOD_MODAL.NEEDS_QR_LABEL' | translate }}
    </label>

  </div>

  <div class="method-dialog__actions">
    <button class="btn-cancel" type="button" (click)="close()">
      {{ 'ADD_PAYMENT_METHOD_MODAL.CANCEL' | translate }}
    </button>
    <button class="btn-confirm" type="button" (click)="save()">
      {{ (editing ? 'COMMON.SAVE' : 'ADD_PAYMENT_METHOD_MODAL.SAVE') | translate }}
    </button>
  </div>

</div>
