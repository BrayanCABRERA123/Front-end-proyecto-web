# web de LavaRápido en producción (imagen Docker). Las llamadas a /api van al API Gateway,
# igual que hace proxy.conf.json con ng serve en desarrollo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # comprobantes de pago y fotos de inspección (el backend acepta hasta 11 MB por petición)
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de Docker: el gateway se busca en cada petición, así nginx arranca aunque el
    # gateway todavía no esté y lo sigue encontrando si se reinicia con otra IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # "api-gateway" es el nombre del servicio en docker compose
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # archivos con hash en el nombre: se pueden guardar en caché mucho tiempo
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # rutas de Angular (/client, /admin/...): siempre index.html, que nunca se guarda en caché
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
